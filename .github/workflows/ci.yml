name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Registry, security, and package gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Detect Markdown-only changes
        id: scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed_files="$(git diff --name-only HEAD^1 HEAD)"
          if [[ -n "$changed_files" ]] && ! grep -Ev '(^|/)[^/]+\.md$' <<<"$changed_files" | grep -q .; then
            echo "full=false" >> "$GITHUB_OUTPUT"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Markdown-only changes
        if: github.event_name == 'pull_request' && steps.scope.outputs.full == 'false'
        run: |
          node scripts/docs-check.mjs
          node scripts/cleanliness-scan.mjs
          node scripts/files-check.mjs

      - name: Set up Node.js
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 20

      - name: Enable Corepack
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: corepack enable

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: corepack pnpm install --frozen-lockfile

      - name: Verify repository
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: corepack pnpm verify:ci

      - name: Check package tarballs
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: node scripts/pack-check.mjs
