name: opentrade-registry

x-ingestion-worker-image: &ingestion-worker-image
  image: ${INGESTION_WORKER_IMAGE:-opentrade-ingestion-worker:local}
  build:
    context: ..
    dockerfile: services/ingestion-worker/Dockerfile

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opentrade}
      POSTGRES_USER: ${POSTGRES_USER:-opentrade_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - records

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - snapshot-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - records

  minio-init:
    image: ${MINIO_CLIENT_IMAGE:-minio/mc:latest}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env}
      MINIO_WORKER_USER: ${MINIO_WORKER_USER:?set MINIO_WORKER_USER in infra/.env}
      MINIO_WORKER_PASSWORD: ${MINIO_WORKER_PASSWORD:?set MINIO_WORKER_PASSWORD in infra/.env}
      SNAPSHOT_BUCKET: ${SNAPSHOT_BUCKET:-opentrade-snapshots}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${SNAPSHOT_BUCKET}"
        mc anonymous set none "local/$${SNAPSHOT_BUCKET}"
        mc version enable "local/$${SNAPSHOT_BUCKET}"
        printf '%s' "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::$${SNAPSHOT_BUCKET}\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\"],\"Resource\":[\"arn:aws:s3:::$${SNAPSHOT_BUCKET}/*\"]}]}" > /tmp/snapshot-writer-policy.json
        mc admin policy create local opentrade-snapshot-writer /tmp/snapshot-writer-policy.json
        mc admin user info local "$${MINIO_WORKER_USER}" >/dev/null 2>&1 || mc admin user add local "$${MINIO_WORKER_USER}" "$${MINIO_WORKER_PASSWORD}"
        mc admin policy attach local opentrade-snapshot-writer --user "$${MINIO_WORKER_USER}"
    networks:
      - records

  record-api:
    build:
      context: ..
      dockerfile: services/record-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-opentrade_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-opentrade}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4173}
      ANONYMOUS_SEARCH_LIMIT: ${ANONYMOUS_SEARCH_LIMIT:-60}
      ANONYMOUS_SEARCH_WINDOW_MS: ${ANONYMOUS_SEARCH_WINDOW_MS:-60000}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      PORT: 8787
    ports:
      - "127.0.0.1:${RECORD_API_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - records

  storage-monitor:
    <<: *ingestion-worker-image
    profiles: ["worker"]
    restart: unless-stopped
    command: ["node", "dist/storage-monitor-main.js"]
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    environment:
      OPENTRADE_STORAGE_MONITOR_PATH: /var/lib/opentrade/snapshots
      OPENTRADE_STORAGE_HEALTH_FILE: /var/run/opentrade/storage-health.json
      OPENTRADE_STORAGE_MONITOR_INTERVAL_MS: ${OPENTRADE_STORAGE_MONITOR_INTERVAL_MS:-30000}
      OPENTRADE_DISK_WARN_FREE_PERCENT: ${OPENTRADE_DISK_WARN_FREE_PERCENT:-15}
      OPENTRADE_DISK_STOP_FREE_PERCENT: ${OPENTRADE_DISK_STOP_FREE_PERCENT:-10}
    volumes:
      - snapshot-data:/var/lib/opentrade/snapshots:ro
      - runtime-state:/var/run/opentrade
    healthcheck:
      test: ["CMD", "node", "-e", "const s=JSON.parse(require('node:fs').readFileSync('/var/run/opentrade/storage-health.json','utf8'));if(Date.now()-Date.parse(s.checkedAt)>90000)process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ingestion-worker:
    <<: *ingestion-worker-image
    profiles: ["worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      storage-monitor:
        condition: service_healthy
    environment:
      DATABASE_URL: ${WORKER_DATABASE_URL:?set WORKER_DATABASE_URL in infra/.env}
      OPENTRADE_WORKER_QUEUE: ${OPENTRADE_WORKER_QUEUE:-ingestion}
      OPENTRADE_WORKER_ID: ${OPENTRADE_WORKER_ID:-ingestion-worker-1}
      OPENTRADE_WORKER_POLL_INTERVAL_MS: ${OPENTRADE_WORKER_POLL_INTERVAL_MS:-1000}
      OPENTRADE_WORKER_HEARTBEAT_INTERVAL_MS: ${OPENTRADE_WORKER_HEARTBEAT_INTERVAL_MS:-30000}
      OPENTRADE_SNAPSHOT_ROOT: /var/lib/opentrade/staging
      OPENTRADE_REGISTRY_ROOT: /app/registry
      OPENTRADE_MAX_SNAPSHOT_BYTES: ${OPENTRADE_MAX_SNAPSHOT_BYTES:-2147483648}
      OPENTRADE_WORKER_ADAPTERS: ${OPENTRADE_WORKER_ADAPTERS:-}
      OPENTRADE_STORAGE_HEALTH_FILE: /var/run/opentrade/storage-health.json
      OPENTRADE_STORAGE_STATUS_MAX_AGE_MS: ${OPENTRADE_STORAGE_STATUS_MAX_AGE_MS:-90000}
      OPENTRADE_DISK_WARN_FREE_PERCENT: ${OPENTRADE_DISK_WARN_FREE_PERCENT:-15}
      OPENTRADE_DISK_STOP_FREE_PERCENT: ${OPENTRADE_DISK_STOP_FREE_PERCENT:-10}
      SNAPSHOT_BUCKET: ${SNAPSHOT_BUCKET:-opentrade-snapshots}
      SNAPSHOT_ARCHIVE_ENDPOINT: http://minio:9000
      SNAPSHOT_ARCHIVE_REGION: ${SNAPSHOT_ARCHIVE_REGION:-us-east-1}
      SNAPSHOT_ARCHIVE_ACCESS_KEY_ID: ${MINIO_WORKER_USER:?set MINIO_WORKER_USER in infra/.env}
      SNAPSHOT_ARCHIVE_SECRET_ACCESS_KEY: ${MINIO_WORKER_PASSWORD:?set MINIO_WORKER_PASSWORD in infra/.env}
    volumes:
      - ${SNAPSHOT_STAGING_PATH:-./snapshots}:/var/lib/opentrade/staging:ro
      - runtime-state:/var/run/opentrade:ro
    networks:
      - records

networks:
  records:
    internal: true

volumes:
  postgres-data:
  snapshot-data:
  runtime-state:
